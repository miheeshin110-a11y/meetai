<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MeetAI 회의록 관리</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="shell">
      <section class="topbar">
        <div>
          <p class="eyebrow">MeetAI</p>
          <h1>회의록 관리</h1>
        </div>
        <div class="status" id="status">대기 중</div>
      </section>

      <section class="layout">
        <form class="panel" id="meeting-form">
          <div class="panel-head">
            <h2>미팅 정보</h2>
            <button type="button" class="ghost" id="sample-button">샘플</button>
          </div>

          <div class="grid">
            <label>
              <span>미팅일</span>
              <input type="date" id="meetingDate" required />
            </label>
            <label>
              <span>거래처명</span>
              <input type="text" id="clientName" placeholder="예: 땡땡거래처" required />
            </label>
            <label>
              <span>작성 담당자</span>
              <input type="text" id="owner" placeholder="예: 김민수" required />
            </label>
            <label>
              <span>앱 비밀번호</span>
              <input type="password" id="appPassword" placeholder="설정한 경우 입력" />
            </label>
          </div>

          <label>
            <span>클로바노트 원문</span>
            <textarea id="transcript" placeholder="클로바노트에서 복사한 회의 텍스트를 붙여넣으세요." required></textarea>
          </label>

          <div class="actions">
            <button type="submit" id="generate-button">AI 회의록 생성</button>
          </div>
        </form>

        <section class="panel preview" id="preview-panel" hidden>
          <div class="panel-head">
            <h2>회의록 미리보기</h2>
            <a id="notion-link" class="link" href="#" target="_blank" rel="noreferrer" hidden>Notion 열기</a>
          </div>
          <div id="empty-state" class="empty">AI 회의록을 생성하면 여기에서 확인하고 수정할 수 있습니다.</div>
          <div id="editor" class="editor" hidden></div>
          <div class="preview-actions">
            <button type="button" id="publish-button" disabled>Notion 업로드 + Slack 알림</button>
          </div>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
